{% extends 'base.html' %}

{% block title %}Calculator{% endblock %}

{% block content %}
<section>
    <h2>Calculate your EOQ</h2>
    <form action="{{ url_for('calculator') }}" method="POST">
        <label for="demand">Annual Demand (D)</label>
        <input type="number" id="demand" name="demand" step="any" required>

        <label for="ordering_cost">Ordering Cost per Order (S)</label>
        <input type="number" id="ordering_cost" name="ordering_cost" step="any" required>

        <label for="holding_cost">Holding Cost per Unit per Year (H)</label>
        <input type="number" id="holding_cost" name="holding_cost" step="any" required>

        <button type="submit">Calculate</button>
    </form>
</section>
{% endblock %}
