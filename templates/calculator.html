<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EOQ Calculator | Calculator</title>
</head>
<body>
    <header>
        <h1>EOQ Calculator</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About EOQ</a>
            <a href="calculator.html">Calculator</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Calculate your EOQ</h2>
            <form action="/eoq" method="POST">
                <label for="demand">Annual Demand (D)</label>
                <input type="number" id="demand" name="demand" step="any" required>

                <label for="ordering_cost">Ordering Cost per Order (S)</label>
                <input type="number" id="ordering_cost" name="ordering_cost" step="any" required>

                <label for="holding_cost">Holding Cost per Unit per Year (H)</label>
                <input type="number" id="holding_cost" name="holding_cost" step="any" required>

                <label for="currency">Currency</label>
                <select id="currency" name="currency">
                    <option>ZAR (R)</option>
                    <option>USD ($)</option>
                </select>

                <button type="submit">Calculate</button>
            </form>
        </section>
    </main>

    <footer>
        <p>BFB 321 Practice Project</p>
    </footer>
</body>
</html>
